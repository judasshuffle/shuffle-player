name: shuffle-player
services:
  player:
    image: shuffle-player:visual-sync-20261113-vlm-debug
    build:
      context: .
      dockerfile: synology/Dockerfile
    user: "1026:100"
    ports:
      - "192.168.68.81:8094:8081"
      - "192.168.68.81:8001:8080"
    environment:
      PUBLIC_LISTENING_BASE: http://shuffle.tplinkdns.com:8001
      SHUFFLE_OWNER_KEY_FILE: /run/shuffle-owner/owner-key
      SHUFFLE_START_PAUSED: "0"
      SHUFFLE_VISUALIZER_BANK: VLM
    volumes:
      - type: bind
        source: /volume1/docker/shuffle-player/secrets
        target: /run/shuffle-owner
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/shuffle-player/data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/Media/Media/LOSSLESS
        target: /mnt/lossless
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /cache:rw,noexec,nosuid,size=512m,uid=1026,gid=100,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -B, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/dr-screen', timeout=15).read()"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 3
