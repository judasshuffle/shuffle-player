name: shuffle-sources-preview
services:
  player:
    image: shuffle-player:sources-preview-20261117
    build:
      context: ..
      dockerfile: synology/Dockerfile
    user: "1026:100"
    ports:
      - "192.168.68.81:8095:8081"
      - "192.168.68.81:8002:8080"
    environment:
      SHUFFLE_LOCAL_LISTENING_BASE: http://192.168.68.81:8002
      PUBLIC_LISTENING_BASE: http://192.168.68.81:8002
      SHUFFLE_WORKING_DIRECTORY: /working
      SHUFFLE_SOURCE_DIRECTORY: /settings
      SHUFFLE_OWNER_KEY_FILE: /run/shuffle-owner/owner-key
      SHUFFLE_START_PAUSED: "0"
      SHUFFLE_VISUALIZER_BANK: VLM
    volumes:
      - type: bind
        source: /volume1/docker/shuffle-player/secrets
        target: /run/shuffle-owner
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/shuffle-player/data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/Media/Media/LOSSLESS
        target: /mnt/lossless
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/shuffle-sources-preview/working
        target: /working
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/docker/shuffle-sources-preview/settings
        target: /settings
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /cache:rw,noexec,nosuid,size=512m,uid=1026,gid=100,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -B, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/dr-screen', timeout=15).read()"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 3

